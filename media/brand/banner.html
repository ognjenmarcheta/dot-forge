<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@400;700&display=swap');
html,body{margin:0;width:1730px;height:909px;overflow:hidden;background:#121419}
body{position:relative;font-family:Inter,sans-serif}
.bg{position:absolute;inset:0;overflow:hidden}
.s{position:absolute;border-radius:40px;transform:rotate(-38deg)}
.s1{width:620px;height:220px;left:-230px;top:-40px;background:linear-gradient(90deg,#1c2d4d,#16233a00)}
.s2{width:520px;height:120px;left:-140px;top:470px;background:#182540;opacity:.8}
.s3{width:520px;height:260px;right:-60px;top:20px;background:linear-gradient(90deg,#1b2a24,#1d3a2a);opacity:.9}
.s4{width:420px;height:150px;right:-120px;bottom:-20px;background:#1a3324;opacity:.8}
.s5{width:300px;height:90px;right:180px;bottom:120px;background:#16223a;opacity:.6}
.term{position:absolute;left:150px;top:180px;width:620px;height:550px;border-radius:22px;background:#0b0d12;
 box-shadow:0 30px 80px #0009, 0 0 0 1px #2a3550;overflow:hidden}
.bar{height:46px;background:#171b24;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #232a3a}
.dot{width:14px;height:14px;border-radius:50%}
.tab{margin-left:22px;font:500 17px 'JetBrains Mono';color:#9fb3d9;background:#0b0d12;padding:9px 16px;border-radius:9px 9px 0 0;margin-top:12px}
pre{margin:0;font:400 23px/1.0 'JetBrains Mono',monospace;color:#cfd6e4;white-space:pre}
.art{position:absolute;left:58px;top:92px}
.c1{color:#4f7fd0}.c2{color:#7aa5ea}.c3{color:#2f4f8a}
.spark{position:absolute;color:#ffb347;font:700 34px 'JetBrains Mono'}
.prompt{position:absolute;left:44px;bottom:42px;font:400 24px 'JetBrains Mono';color:#cfd6e4}
.g{color:#6fcf73}.b{color:#5b8de0}.o{color:#ffb347}
.cur{display:inline-block;width:13px;height:27px;background:#ffb347;vertical-align:-5px;margin-left:4px}
.txt{position:absolute;left:840px;top:260px}
h1{margin:0;font-weight:800;font-size:150px;letter-spacing:-3px;color:#fff;line-height:1}
.sub{margin-top:34px;font-weight:500;font-size:50px;line-height:1.25;color:#c9cfdb}
.tags{margin-top:44px;font-weight:500;font-size:40px}
.tags .sep{color:#c9cfdb;margin:0 14px}
</style></head><body>
<div class="bg"><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div><div class="s s4"></div><div class="s s5"></div></div>
<div class="term">
 <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="tab">~/Github</span></div>
 <span class="spark" style="left:300px;top:66px">✦</span><span class="spark" style="left:282px;top:96px;font-size:20px">✦</span><span class="spark" style="left:338px;top:100px;font-size:16px;color:#ff8a3d">✦</span>
 <pre class="art">@@ART@@</pre>
 <pre class="info" style="position:absolute;left:46px;top:350px;font-size:21px;line-height:1.6;color:#8b95a8"><span class="o">●</span> <span style="color:#cfd6e4">2 agents waiting</span>   <span class="g">✓</span> CI green
<span class="b">◆</span> night shift: 3 tasks queued
<span class="g">✓</span> 4 commits pushed  ·  tip: <span class="b">dot keys</span></pre>
 <div class="prompt"><span class="g">❯</span> dot <span class="b">upgrade</span><span class="cur"></span></div>
</div>
<div class="txt">
 <h1>Dot Forge</h1>
 <div class="sub">One terminal setup.<br>Every machine, every agent.</div>
 <div class="tags"><span class="g">macOS</span><span class="sep">•</span><span class="b">Linux</span><span class="sep">•</span><span class="g">WezTerm</span><span class="sep">•</span><span class="b">Neovim</span></div>
</div>
</body></html>
