name: Bug report
description: Something in the setup is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it printed. Paste the output.
      placeholder: Ran `dot upgrade`, it printed ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Machine
      options:
        - macOS
        - Linux (Ubuntu/Debian)
        - Both
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: dot doctor
      description: Output of `dot doctor`, if it is relevant.
      render: text
