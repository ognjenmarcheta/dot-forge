name: Feature request
description: A tool, command or config the setup should have.
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should you be able to do? One observable behavior.
      placeholder: Running `dot X` shows ...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What is slow, annoying or missing today?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Machine
      options:
        - Both
        - macOS only
        - Linux only
    validations:
      required: true
