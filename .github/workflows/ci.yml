# Lint + a full fresh-machine install on Linux, then doctor + Neovim smoke test.
# Runs on the self-hosted runner on the workstation (kaine-ci-linux, same as
# kaine-forge / ordina-forge) while its heartbeat says it's up, otherwise on
# GitHub's ubuntu-latest. See kaine-forge docs/self-hosted-ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly: catches upstream releases that break the install

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh lua5.4 python3-yaml tmux ttyd >/dev/null
      - run: bash tests/lint.sh
      - name: standup / client updates / subscription guard
        run: bash tests/work.sh
      - name: night shift / recall / habits / share mode / dot new
        run: bash tests/features.sh
      - name: startup card / dot tip
        run: bash tests/hello.sh
      - name: dot ports / dot name
        run: bash tests/ports.sh
      - name: dot wrapped / credits / calendar
        run: bash tests/wrapped.sh
      - name: dot invite for real (tmux + ttyd, --local)
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          bash config/scripts/dot-invite --local --for 5m
          port=$(sed -n 's/^port=//p' "$XDG_STATE_HOME/dotfiles/invite/current")
          path=$(sed -n 's|^url=http://[^/]*/\([^/]*\)/$|\1|p' "$XDG_STATE_HOME/dotfiles/invite/current")
          test "${#path}" -ge 20
          code=$(curl -s -o page.html -w '%{http_code}' "http://127.0.0.1:$port/$path/")
          echo "secret path: $code"; test "$code" = 200; grep -qi ttyd page.html
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/")
          echo "without it: $code"; test "$code" != 200
          tmux -L dot-invite list-sessions
          bash config/scripts/dot-invite stop
          ! curl -s -o /dev/null "http://127.0.0.1:$port/$path/"
      - name: dot try for real (Docker; the sandbox is locked down from the inside)
        run: |
          if ! docker info >/dev/null 2>&1; then echo "no Docker on this runner — skipped"; exit 0; fi
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache" DOT_TRY_NO_TAB=1
          bash config/scripts/dot-try chalk/ansi-regex --no-tour
          c=$(docker ps --filter label=dot.try=1 --format '{{.Names}}' | head -n 1)
          test -n "$c"
          uid=$(docker exec "$c" id -u); echo "uid in sandbox: $uid"; test "$uid" != 0
          cap=$(docker exec "$c" sh -c "grep CapEff /proc/self/status | awk '{print \$2}'"); echo "capabilities: $cap"; test "$cap" = 0000000000000000
          docker exec "$c" sh -c 'test ! -e /var/run/docker.sock && test ! -e "$HOME/.ssh"' && echo "no docker socket, no ssh keys"
          docker exec "$c" test -d /work/node_modules && echo "dependencies installed inside"
          bash config/scripts/dot-try list
          bash config/scripts/dot-try rm --all
          test -z "$(docker ps -a --filter label=dot.try=1 -q)"
      - name: WezTerm config loads (same version as the Flatpak, else nightly)
        run: |
          base=https://github.com/wez/wezterm/releases/download
          curl -fsSL -o "$RUNNER_TEMP/wezterm.deb" "$base/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb"
          if ! sudo apt-get install -y -qq "$RUNNER_TEMP/wezterm.deb" >/dev/null 2>&1; then
            echo "stable .deb doesn't install on this Ubuntu — using the nightly build"
            curl -fsSL -o "$RUNNER_TEMP/wezterm.deb" "$base/nightly/wezterm-nightly.Ubuntu$(. /etc/os-release; echo "$VERSION_ID").deb"
            sudo apt-get install -y -qq "$RUNNER_TEMP/wezterm.deb" >/dev/null
          fi
          bash tests/wezterm-config.sh

  linux-install:
    needs: lint
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }} # release lookups without the 60/h API limit
      NVIM_SMOKE_WAIT_MS: "20000"
    steps:
      - uses: actions/checkout@v7
      - name: Fresh home folder (like a new machine)
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/home/.config" >> "$GITHUB_ENV"   # runners preset it to the real home
      - name: install.sh
        timeout-minutes: 20
        run: ./install.sh
      - name: Doctor + Neovim smoke test
        timeout-minutes: 5
        run: bash tests/doctor.sh --nvim
      - name: Re-running install.sh changes nothing
        timeout-minutes: 10
        run: |
          ./install.sh --no-nvim
          if [ -d "$HOME/.dotfiles-backup" ]; then
            echo "::error::second run moved configs to a backup:"; ls -R "$HOME/.dotfiles-backup"; exit 1
          fi
      - name: --upgrade works
        timeout-minutes: 15
        run: ./install.sh --upgrade --no-nvim
