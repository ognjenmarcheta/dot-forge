format = """
[](#9A348E)\
$os\
${custom.user_placeholder}\
[](bg:#DA627D fg:#9A348E)\
${custom.dir_placeholder}\
[](fg:#FF6900 bg:#FFFFFF)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
${custom.node_edit}\
$nim\
$rust\
$scala\
[](fg:#FFFFFF bg:#06969A)\
$docker_context\
[ ](fg:#FFFFFF)\
"""

right_format = """
[](fg:#DA627D bg:#FF6900)\
${custom.git_link_start}\
$git_branch\
${custom.git_link_end}\
$git_status\
$git_metrics\
[](fg:#FFFFFF bg:#33658A)\
