# tmux settings for `dot invite` only (its own server: tmux -L dot-invite).
# Your normal tmux setup, if any, is not touched.
set -g status off
set -g mouse on
set -s escape-time 0
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#T"
# no prefix key: nothing in the shared tab behaves differently from a normal tab
set -g prefix None
unbind C-b
# someone opened the link / left
set-hook -g client-attached 'display-message -d 4000 "👀 someone opened your link — #{e|-:#{session_attached},1} watching"'
set-hook -g client-detached 'display-message -d 3000 "👋 a viewer left — #{e|-:#{session_attached},1} watching"'
